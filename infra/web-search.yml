AWSTemplateFormatVersion: "2010-09-09"
Description: Circles planner web search (AgentCore Gateway with the managed Web Search connector)

Resources:
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: web-search
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*
              - Effect: Allow
                Action: bedrock-agentcore:InvokeWebSearch
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:tool/web-search.v1

  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: circles-web-search
      ProtocolType: MCP
      AuthorizerType: AWS_IAM
      RoleArn: !GetAtt GatewayRole.Arn

  WebSearchTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt Gateway.GatewayIdentifier
      Name: web-search
      TargetConfiguration:
        Mcp:
          Connector:
            Source:
              ConnectorId: web-search
            Configurations:
              - Name: WebSearch
                ParameterValues: {}
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE

Outputs:
  GatewayUrl:
    Value: !GetAtt Gateway.GatewayUrl
